<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibre Loss Calculator</title>
</head>

<body>

    <h1>Fibre Loss Calculator</h1>

    <p>Calculate estimated optical fibre loss.</p>

    <label for="fibreLength">Fibre Length (km):</label>
    <input
        id="fibreLength"
        type="number"
        min="0"
        step="0.01"
        value="10"
    >

    <br><br>

    <label for="attenuation">Attenuation (dB/km):</label>
    <input
        id="attenuation"
        type="number"
        min="0"
        step="0.01"
        value="0.35"
    >

    <br><br>

    <label for="spliceCount">Number of Splices:</label>
    <input
        id="spliceCount"
        type="number"
        min="0"
        step="1"
        value="4"
    >

    <br><br>

    <label for="spliceLoss">Loss per Splice (dB):</label>
    <input
        id="spliceLoss"
        type="number"
        min="0"
        step="0.01"
        value="0.10"
    >

    <br><br>

    <label for="connectorCount">Number of Connectors:</label>
    <input
        id="connectorCount"
        type="number"
        min="0"
        step="1"
        value="2"
    >

    <br><br>

    <label for="connectorLoss">Loss per Connector (dB):</label>
    <input
        id="connectorLoss"
        type="number"
        min="0"
        step="0.01"
        value="0.50"
    >

    <br><br>

    <button onclick="calculateLoss()">
        Calculate Loss
    </button>

    <h2 id="result">
        Total fibre loss: 0.00 dB
    </h2>

    <script src="script.js"></script>

</body>
</html>
